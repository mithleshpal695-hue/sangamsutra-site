const DOBSelector = ({val,set}) => {
  const now = new Date();
  const currentYear = now.getFullYear();
  const years = Array.from({length:83},(_,i)=>currentYear-18-i); // 18 to 100
  const days = Array.from({length:31},(_,i)=>String(i+1).padStart(2,"0"));
  const [dd,setDd]=useState("");
  const [mm,setMm]=useState("");
  const [yy,setYy]=useState("");
  useEffect(()=>{
    if(val){const p=val.split("-");if(p.length===3){setYy(p[0]);setMm(p[1]);setDd(p[2]);}}
  },[]);
  useEffect(()=>{if(dd&&mm&&yy)set(\`\${yy}-\${mm}-\${dd}\`);},[dd,mm,yy]);
  const selStyle={...s.inp,appearance:"none",cursor:"pointer",flex:1,padding:"11px 8px"};
  return(
    <F l="Date of Birth" req>
      <div style={{display:"flex",gap:8}}>
        <div style={{position:"relative",flex:1}}>
          <select value={dd} onChange={e=>setDd(e.target.value)} style={selStyle}>
            <option value="">Day</option>
            {days.map(d=><option key={d} value={d}>{d}</option>)}
          </select>
          <span style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",pointerEvents:"none",color:C.tl,fontSize:11}}>▾</span>
        </div>
        <div style={{position:"relative",flex:1.4}}>
          <select value={mm} onChange={e=>setMm(e.target.value)} style={selStyle}>
            <option value="">Month</option>
            {MONTHS.map((m,i)=><option key={m} value={String(i+1).padStart(2,"0")}>{m}</option>)}
          </select>
          <span style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",pointerEvents:"none",color:C.tl,fontSize:11}}>▾</span>
        </div>
        <div style={{position:"relative",flex:1.2}}>
          <select value={yy} onChange={e=>setYy(e.target.value)} style={selStyle}>
            <option value="">Year</option>
            {years.map(y=><option key={y} value={String(y)}>{y}</option>)}
          </select>
          <span style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",pointerEvents:"none",color:C.tl,fontSize:11}}>▾</span>
        </div>
      </div>
      {dd&&mm&&yy&&<div style={{fontSize:11,color:C.ok,marginTop:4,fontWeight:600}}>✓ {dd} {MONTHS[parseInt(mm)-1]} {yy}</div>}
    </F>
  );
};

// ── OTP LOGIN ─────────────────────────────────────────────────
const OTPLogin = ({onLogin,onAdminLogin,toastFn}) => {
  const [phase,setPhase]=useState("mobile");
  const [mobile,setMobile]=useState("");
  const [otp,setOtp]=useState(["","","","","",""]);
  const [timer,setTimer]=useState(0);
  const [name,setName]=useState("");
  const [adminMode,setAdminMode]=useState(false);
  const [adminPass,setAdminPass]=useState("");
  const [loading,setLoading]=useState(false);
  const [confirmResult,setConfirmResult]=useState(null);
  const refs=Array.from({length:6},()=>useRef(null));
  useEffect(()=>{if(timer>0){const t=setTimeout(()=>setTimer(v=>v-1),1000);return()=>clearTimeout(t);}},[timer]);

  const sendOTP=async()=>{
    if(mobile.length!==10){toastFn("Enter valid 10-digit mobile number","err");return;}
    setLoading(true);
    try{
      // Setup invisible recaptcha
      if(!window.recaptchaVerifier){
        window.recaptchaVerifier = setupRecaptcha(auth); if(false){
}
      const phoneNumber = \`+91\${mobile}\`;
      const result = await signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier);
      setConfirmResult(result);
      setTimer(30);
      setPhase("otp");
      toastFn("OTP sent to +91 " + mobile + " 📱");
    } catch(e){
      console.error(e);
      // Fallback for testing if Firebase phone auth not enabled
      const code=Math.floor(100000+Math.random()*900000).toString();
      window._demoOtp = code;
      setTimer(30);
      setPhase("otp");
      toastFn(\`Demo OTP: \${code} (Firebase fallback) 📱\`);
    }
    setLoading(false);
  };

  const verifyOTP=async()=>{
    const entered=otp.join("");
    if(entered.length!==6){toastFn("Enter 6-digit OTP","err");return;}
    setLoading(true);
    try{
      if(confirmResult){
        // Real Firebase verification
        const result = await confirmResult.confirm(entered);
        const uid = result.user.uid;
        // Check if user exists in Firestore
        const existing = await getUserProfile(uid);
        if(existing){
          onLogin({...existing, uid, isNew:false});
          toastFn("Welcome back! 🎉");
        } else {
          setPhase("name");
          window._firebaseUid = uid;
        }
      } else {
        // Demo fallback
        if(entered !== window._demoOtp){toastFn("Wrong OTP","err");setLoading(false);return;}
        setPhase("name");
        window._firebaseUid = "demo_" + mobile + "_" + Date.now();
      }
    } catch(e){
      toastFn("Wrong OTP. Try again","err");
    }
    setLoading(false);
  };
  const handleOtpChange=(idx,val)=>{
    if(!/^\d*$/.test(val))return;
    const n=[...otp];n[idx]=val.slice(-1);setOtp(n);
    if(val&&idx<5)refs[idx+1].current?.focus();
    if(!val&&idx>0)refs[idx-1].current?.focus();
  };
  if(adminMode)return(
    <div style={{padding:"0 0 16px"}}>
      <div style={{background:C.adminL,borderRadius:14,padding:18,marginBottom:16,textAlign:"center"}}>
        <div style={{fontSize:38}}>🔐</div>
        <div style={{fontSize:15,fontWeight:800,color:C.admin,marginTop:6}}>Admin Login</div>
        <div style={{fontSize:11,color:"#5C6BC0",marginTop:3}}>SangamSutra Control Panel</div>
      </div>
      <F l="Admin Password"><input type="password" value={adminPass} onChange={e=>setAdminPass(e.target.value)} placeholder="Enter admin password" style={s.inp}/></F>
      <div style={{fontSize:11,color:C.tl,marginBottom:14,textAlign:"center"}}>Demo: admin@vivah123</div>
      <button style={{...s.btn,background:\`linear-gradient(135deg,\${C.admin},#283593)\`}} onClick={()=>{if(adminPass==="admin@vivah123")onAdminLogin();else toastFn("Wrong password","err");}}>🔐 Login as Admin</button>
      <button onClick={()=>setAdminMode(false)} style={{...s.btn,marginTop:10,background:"transparent",color:C.p,border:\`2px solid \${C.p}\`,boxShadow:"none"}}>← Back</button>
    </div>
  );
  if(phase==="name")return(
    <div style={{padding:"0 0 16px"}}>
      <div style={{background:C.pl,borderRadius:14,padding:18,marginBottom:18,textAlign:"center"}}>
        <div style={{fontSize:44}}>🎉</div>
        <div style={{fontSize:15,fontWeight:800,color:C.p,marginTop:6}}>Welcome to SangamSutra!</div>
        <div style={{fontSize:12,color:C.tm,marginTop:3}}>Tell us your name to get started</div>
      </div>
      <I l="Your Full Name" val={name} set={setName} ph="As per Aadhaar" req/>
      <button style={s.btn} onClick={()=>{if(!name.trim()){toastFn("Please enter your name","err");return;}onLogin({mobile,name,emoji:"🙂",isNew:true});}}>Continue →</button>
    </div>
  );
  if(phase==="otp")return(
    <div style={{padding:"0 0 16px"}}>
      <div style={{textAlign:"center",marginBottom:22}}>
        <div style={{fontSize:44}}>📱</div>
        <div style={{fontSize:15,fontWeight:800,color:C.t,marginTop:8}}>Verify OTP</div>
        <div style={{fontSize:12,color:C.tm,marginTop:3}}>Sent to +91 {mobile}</div>
        <div style={{fontSize:11,color:C.p,marginTop:2,fontWeight:700}}>Check toast for demo OTP ↑</div>
      </div>
      <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:22}}>
        {otp.map((digit,idx)=>(
          <input key={idx} ref={refs[idx]} type="tel" maxLength={1} value={digit}
            onChange={e=>handleOtpChange(idx,e.target.value)}
            onKeyDown={e=>{if(e.key==="Backspace"&&!digit&&idx>0)refs[idx-1].current?.focus();}}
            style={{width:42,height:50,textAlign:"center",fontSize:22,fontWeight:800,border:\`2px solid \${digit?C.p:C.b}\`,borderRadius:12,outline:"none",background:digit?C.pl:"#FFF",color:C.p}}/>
        ))}
      </div>
      <button style={s.btn} onClick={verifyOTP}>Verify OTP →</button>
      <div style={{textAlign:"center",marginTop:14}}>
        {timer>0?<span style={{fontSize:13,color:C.tl}}>Resend in <b>{timer}s</b></span>:<span style={{fontSize:13,color:C.p,cursor:"pointer",fontWeight:700}} onClick={sendOTP}>Resend OTP</span>}
      </div>
      <button onClick={()=>setPhase("mobile")} style={{...s.btn,marginTop:12,background:"transparent",color:C.p,border:\`2px solid \${C.p}\`,boxShadow:"none"}}>← Change Number</button>
    </div>
  );
  return(
    <div style={{padding:"0 0 16px"}}>
      <div style={{background:C.pl,borderRadius:14,padding:16,marginBottom:18,textAlign:"center"}}>
        <div style={{fontSize:13,color:C.tm,lineHeight:1.7}}>🔒 Login with mobile OTP<br/>No password needed!</div>
      </div>
      <F l="Mobile Number" req>
        <div style={{display:"flex",gap:8}}>

// ── MULTIPLE PHOTOS MANAGER ───────────────────────────────────
const PhotosManager = ({photos, setPhotos, onBack}) => {
  const fileRef = useRef(null);
  const addPhotos = (e) => {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = ev => {
        setPhotos(prev => {
          if (prev.length >= 10) return prev;
          return [...prev, {id: Date.now() + Math.random(), url: ev.target.result, isPrimary: prev.length === 0}];
        });
      };
      reader.readAsDataURL(file);
    });
  };
  const deletePhoto = (id) => setPhotos(prev => {
    const filtered = prev.filter(p => p.id !== id);
    if (filtered.length > 0 && !filtered.some(p => p.isPrimary)) {
      filtered[0].isPrimary = true;
    }
    return filtered;
  });
  const setPrimary = (id) => setPhotos(prev => prev.map(p => ({...p, isPrimary: p.id === id})));
  return (
    <div style={{fontFamily:"Georgia,serif",background:C.bg,minHeight:"100vh",maxWidth:480,margin:"0 auto"}}>
      <div style={{background:\`linear-gradient(135deg,\${C.pd},\${C.p})\`,padding:"13px 16px",display:"flex",alignItems:"center",gap:10,position:"sticky",top:0,zIndex:10}}>
        <div onClick={onBack} style={{cursor:"pointer",color:"#FFF",fontSize:22}}>←</div>
        <div style={{color:"#FFF",fontWeight:700,fontSize:16}}>📸 Manage Photos</div>
        <div style={{marginLeft:"auto",color:"rgba(255,255,255,0.8)",fontSize:12}}>{photos.length}/10</div>
      </div>
      <div style={{padding:14}}>
        <div style={{background:C.al,borderRadius:12,padding:14,marginBottom:16,fontSize:12,color:"#8B6914",lineHeight:1.7}}>
          📌 <strong>Tips:</strong> Upload up to 10 photos • First photo is your profile photo • Tap ⭐ to set as primary • Tap 🗑 to delete
        </div>
        {/* Upload Button */}
        <div onClick={()=>fileRef.current?.click()} style={{border:\`2px dashed \${C.p}\`,borderRadius:14,padding:20,textAlign:"center",background:C.pl,cursor:"pointer",marginBottom:16}}>
          <div style={{fontSize:32}}>📷</div>
          <div style={{fontSize:14,fontWeight:700,color:C.p,marginTop:6}}>Add Photos</div>
          <div style={{fontSize:11,color:C.tl,marginTop:3}}>JPG, PNG up to 5MB each • Max 10 photos</div>
        </div>
        <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={addPhotos}/>
        {/* Photos Grid */}
        {photos.length === 0 ? (
          <div style={{textAlign:"center",padding:"30px 20px",color:C.tl}}>
            <div style={{fontSize:48}}>🖼️</div>
            <div style={{marginTop:10,fontWeight:600,color:C.t}}>No photos yet</div>
            <div style={{fontSize:12,marginTop:5}}>Tap above to add your photos</div>
          </div>
        ) : (
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {photos.map((photo, idx) => (
              <div key={photo.id} style={{position:"relative",borderRadius:14,overflow:"hidden",border:\`2px solid \${photo.isPrimary ? C.p : C.b}\`,boxShadow:photo.isPrimary?"0 4px 16px rgba(181,69,27,0.25)":"0 2px 8px rgba(0,0,0,0.1)"}}>
                <img src={photo.url} alt="" style={{width:"100%",height:170,objectFit:"cover",display:"block"}}/>
                {photo.isPrimary && (
                  <div style={{position:"absolute",top:8,left:8,background:C.p,color:"#FFF",borderRadius:20,padding:"3px 10px",fontSize:10,fontWeight:700}}>⭐ Primary</div>
                )}
                <div style={{position:"absolute",top:8,right:8,display:"flex",gap:6}}>
                  {!photo.isPrimary && (
                    <div onClick={()=>setPrimary(photo.id)} style={{width:30,height:30,borderRadius:"50%",background:"rgba(212,160,23,0.9)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:14}}>⭐</div>
                  )}
                  <div onClick={()=>deletePhoto(photo.id)} style={{width:30,height:30,borderRadius:"50%",background:"rgba(192,57,43,0.9)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:14}}>🗑</div>
                </div>
                <div style={{position:"absolute",bottom:0,left:0,right:0,background:"rgba(0,0,0,0.5)",padding:"6px 8px"}}>
                  <div style={{fontSize:10,color:"#FFF",fontWeight:600}}>Photo {idx+1}</div>
                </div>
              </div>
            ))}
          </div>
        )}
        {photos.length > 0 && (
          <div style={{marginTop:16,background:C.card,borderRadius:12,padding:14,border:\`1px solid \${C.b}\`}}>
            <div style={{fontSize:12,fontWeight:700,color:C.p,marginBottom:8}}>📋 Photo Summary</div>
            <div style={{fontSize:12,color:C.tm}}>Total photos: <strong>{photos.length}/10</strong></div>
            <div style={{fontSize:12,color:C.tm,marginTop:4}}>Primary photo: <strong>Photo {photos.findIndex(p=>p.isPrimary)+1}</strong></div>
          </div>
        )}
      </div>
    </div>
  );
};

const RASHI_COMPATIBILITY = {
  "Mesh":     ["Simha","Dhanu","Kumbh","Mithun"],
  "Vrishabh": ["Kanya","Makar","Kark","Meen"],
  "Mithun":   ["Tula","Kumbh","Mesh","Simha"],
  "Kark":     ["Vrishchik","Meen","Vrishabh","Kanya"],
  "Simha":    ["Mesh","Dhanu","Mithun","Tula"],
  "Kanya":    ["Vrishabh","Makar","Kark","Vrishchik"],
  "Tula":     ["Mithun","Kumbh","Simha","Dhanu"],
  "Vrishchik":["Kark","Meen","Kanya","Makar"],
  "Dhanu":    ["Mesh","Simha","Tula","Kumbh"],
  "Makar":    ["Vrishabh","Kanya","Vrishchik","Meen"],
  "Kumbh":    ["Mithun","Tula","Mesh","Dhanu"],
  "Meen":     ["Kark","Vrishchik","Vrishabh","Makar"],
};

const CASTE_HIERARCHY = {
  "Brahmin":1,"Kshatriya":2,"Vaishya":3,"Rajput":2,
  "Kayastha":3,"Yadav":4,"Kurmi":4,"Lodhi":4,
  "Teli":4,"Mali":4,"Nai":5,"Gond":5,"Baiga":5,
  "Other OBC":4,"Other SC":5,"Other ST":5,"Other":6,
};

const EDUCATION_LEVEL = {
  "Below 10th":1,"10th Pass":2,"12th Pass":3,
  "ITI/Diploma":4,"Graduate (BA/BSc/BCom)":5,
  "Graduate (Engineering)":6,"Graduate (Medical)":7,
  "Post Graduate":8,"MBA":9,"PhD":10,"Other":5,
};

const INCOME_LEVEL = {
  "No Income":0,"Below ₹1L":1,"₹1–2L":2,
  "₹2–5L":3,"₹5–10L":4,"₹10–20L":5,"Above ₹20L":6,
};

const calculateMatchScore = (profile1, profile2) => {
  let score = 0;
  let breakdown = [];

  // Determine who is male/female
  const male = profile1.gender === "Male" || profile1.emoji === "👨" ? profile1 : profile2;
  const female = profile1.gender === "Female" || profile1.emoji === "👩" ? profile1 : profile2;

  // 1. RELIGION MATCH — 20 points
  if (profile1.religion && profile2.religion) {
    if (profile1.religion === profile2.religion) {
      score += 20;
      breakdown.push({param:"Religion", pts:20, max:20, status:"perfect"});
    } else {
      breakdown.push({param:"Religion", pts:0, max:20, status:"mismatch"});
    }
  }

  // 2. CASTE MATCH — 15 points
  if (profile1.caste && profile2.caste) {
    if (profile1.caste === profile2.caste) {
      score += 15;
      breakdown.push({param:"Caste", pts:15, max:15, status:"perfect"});
    } else {
      const h1 = CASTE_HIERARCHY[profile1.caste] || 6;
      const h2 = CASTE_HIERARCHY[profile2.caste] || 6;
      const diff = Math.abs(h1 - h2);
      if (diff <= 1) {
        score += 8;
        breakdown.push({param:"Caste", pts:8, max:15, status:"good"});
      } else {
        score += 2;
        breakdown.push({param:"Caste", pts:2, max:15, status:"different"});
      }
    }
  }

  // 3. MANGLIK MATCH — 15 points
  if (profile1.manglik && profile2.manglik) {
    const m1 = profile1.manglik;
    const m2 = profile2.manglik;
    if (m1 === m2) {
      score += 15;
      breakdown.push({param:"Manglik", pts:15, max:15, status:"perfect"});
    } else if (
      (m1 === "Anshik Manglik" && m2 === "Manglik") ||
      (m2 === "Anshik Manglik" && m1 === "Manglik")
    ) {
      score += 8;
      breakdown.push({param:"Manglik", pts:8, max:15, status:"partial"});
    } else if (m1 === "Don't Know" || m2 === "Don't Know") {
      score += 7;
      breakdown.push({param:"Manglik", pts:7, max:15, status:"unknown"});
    } else {
      score += 0;
      breakdown.push({param:"Manglik", pts:0, max:15, status:"mismatch"});
    }
  }

  // 4. AGE COMPATIBILITY — 10 points
  const maleAge = parseInt(male.age) || 25;
  const femaleAge = parseInt(female.age) || 22;
  const ageDiff = maleAge - femaleAge;
  if (ageDiff >= 2 && ageDiff <= 5) {
    score += 10;
    breakdown.push({param:"Age Gap", pts:10, max:10, status:"perfect"});
  } else if (ageDiff >= 0 && ageDiff <= 7) {
    score += 7;
    breakdown.push({param:"Age Gap", pts:7, max:10, status:"good"});
  } else if (ageDiff >= -2 && ageDiff < 0) {
    score += 4;
    breakdown.push({param:"Age Gap", pts:4, max:10, status:"average"});
  } else {
    score += 1;
    breakdown.push({param:"Age Gap", pts:1, max:10, status:"poor"});
  }

  // 5. EDUCATION COMPATIBILITY — 10 points
  if (profile1.edu && profile2.edu) {
    const e1 = EDUCATION_LEVEL[profile1.edu] || 5;
    const e2 = EDUCATION_LEVEL[profile2.edu] || 5;
    const maleEdu = male.edu ? EDUCATION_LEVEL[male.edu] || 5 : e1;
    const femaleEdu = female.edu ? EDUCATION_LEVEL[female.edu] || 5 : e2;
    const eduDiff = maleEdu - femaleEdu;
    if (eduDiff >= 0 && eduDiff <= 2) {
      score += 10;
      breakdown.push({param:"Education", pts:10, max:10, status:"perfect"});
    } else if (Math.abs(eduDiff) <= 3) {
      score += 6;
      breakdown.push({param:"Education", pts:6, max:10, status:"good"});
    } else {
      score += 3;
      breakdown.push({param:"Education", pts:3, max:10, status:"average"});
    }
  }

  // 6. INCOME COMPATIBILITY — 10 points
  if (profile1.income && profile2.income) {
    const maleInc = INCOME_LEVEL[male.income] || 2;
    const femaleInc = INCOME_LEVEL[female.income] || 1;
    if (maleInc >= femaleInc) {
      score += 10;
      breakdown.push({param:"Income", pts:10, max:10, status:"perfect"});
    } else if (maleInc >= femaleInc - 1) {
      score += 6;
      breakdown.push({param:"Income", pts:6, max:10, status:"good"});
    } else {
      score += 3;
      breakdown.push({param:"Income", pts:3, max:10, status:"average"});
    }
  }

  // 7. LOCATION PROXIMITY — 8 points
  if (profile1.state && profile2.state) {
    if (profile1.district && profile2.district &&
        profile1.district === profile2.district) {
      score += 8;
      breakdown.push({param:"Location", pts:8, max:8, status:"perfect"});
    } else if (profile1.state === profile2.state) {
      score += 5;
      breakdown.push({param:"Location", pts:5, max:8, status:"good"});
    } else {
      score += 2;
      breakdown.push({param:"Location", pts:2, max:8, status:"different"});
    }
  }

  // 8. RASHI COMPATIBILITY — 7 points
  if (profile1.rashi && profile2.rashi) {
    const r1Compatible = RASHI_COMPATIBILITY[profile1.rashi] || [];
    if (r1Compatible.includes(profile2.rashi)) {
      score += 7;
      breakdown.push({param:"Rashi", pts:7, max:7, status:"perfect"});
    } else {
      score += 2;
      breakdown.push({param:"Rashi", pts:2, max:7, status:"average"});
    }
  }

  // 9. FAMILY TYPE — 5 points
  if (profile1.fType && profile2.fType) {
    if (profile1.fType === profile2.fType) {
      score += 5;
      breakdown.push({param:"Family Type", pts:5, max:5, status:"perfect"});
    } else {
      score += 2;
      breakdown.push({param:"Family Type", pts:2, max:5, status:"average"});
    }
  }

  const percentage = Math.min(100, Math.round(score));
  const grade = percentage >= 75 ? "Excellent" :
                percentage >= 55 ? "Good" :
                percentage >= 35 ? "Average" : "Low";
  const gradeColor = percentage >= 75 ? "#2D7A4F" :
                     percentage >= 55 ? "#D4A017" :
                     percentage >= 35 ? "#E65100" : "#C0392B";

  return { score: percentage, grade, gradeColor, breakdown };
};

const getAutoMatches = (currentUser, allProfiles, limit = 10) => {
  if (!currentUser) return [];
  const oppositeGender = currentUser.gender === "Male" ||
    currentUser.emoji === "👨" ? "👩" : "👨";

  return allProfiles
    .filter(p => p.emoji === oppositeGender && p.status === "active")
    .map(p => ({
      ...p,
      matchResult: calculateMatchScore(currentUser, p)
    }))
    .sort((a, b) => b.matchResult.score - a.matchResult.score)
    .slice(0, limit);
};

              {/* Score bar */}
              <div style={{background:C.b,borderRadius:20,height:5,marginBottom:6,overflow:"hidden"}}>

              </div>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
};

// ── MAIN APP ──────────────────────────────────────────────────
function SangamSutraApp() {
  const [scr,setScr]=useState("splash");
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState("home");
  const [regMode,setRegMode]=useState(false);
  const [step,setStep]=useState(1);
  const [sel,setSel]=useState(null);
  const [chatProfile,setChatProfile]=useState(null);

  const [activePlan,setActivePlan]=useState(null);
  const [selectedPlan,setSelectedPlan]=useState(null);
  const [photos,setPhotos]=useState([]);

  const [showEarlyBird,setShowEarlyBird]=useState(false);
  const [matchScoreProfile,setMatchScoreProfile]=useState(null);
  const [earlyBirdClaimed,setEarlyBirdClaimed]=useState(false);

    (async()=>{
      const count = await getTotalUserCount();

    })();
  },[]);
  const [f,setF]=useState({name:"",mob:"",dob:"",gender:"",rel:"",caste:"",gotra:"",marital:"",height:"",complex:"",manglik:"",rashi:"",nakshatra:"",bplace:"",btime:"",edu:"",prof:"",employer:"",income:"",fname:"",focc:"",mname:"",mocc:"",sib:"",ftype:"",fstatus:"",state:"",district:"",city:"",pin:"",about:"",pexp:""});
  const sf=k=>v=>setF(p=>({...p,[k]:v}));
  const msg=(m,t="ok")=>{setToast({m,t});setTimeout(()=>setToast(null),3000);};
  const sendInt=(id,e)=>{if(e)e.stopPropagation();if(!ints.includes(id)){setInts(i=>[...i,id]);msg("Interest sent! 💕");}};

  useEffect(()=>{setTimeout(()=>setScr("auth"),2400);},[]);

  if(scr==="splash")return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:\`linear-gradient(160deg,\${C.pd},\${C.p} 55%,\${C.a})\`,fontFamily:"Georgia,serif"}}>
      <style>{\`@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}@keyframes bob{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}\`}</style>
      <div style={{textAlign:"center",animation:"rise 1s ease"}}>
        <div style={{fontSize:78,animation:"bob 2s infinite"}}>🪷</div>
        <div style={{fontSize:32,fontWeight:800,color:"#FFF",marginTop:10}}>SangamSutra</div>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.7)",letterSpacing:3,marginTop:5,textTransform:"uppercase"}}>Sacred Thread of Union 🪷</div>
        <div style={{fontSize:13,color:"rgba(255,255,255,0.5)",marginTop:28}}>संगम सूत्र — Where Souls Unite</div>
        <div style={{marginTop:32,display:"flex",gap:8,justifyContent:"center"}}>{[0,1,2].map(i=><div key={i} style={{width:8,height:8,borderRadius:"50%",background:i===0?"#FFF":"rgba(255,255,255,0.3)",animation:\`bob 1.4s \${i*0.25}s infinite\`}}/>)}</div>
      </div>
    </div>
  );

  if(scr==="admin")return <AdminPanel onLogout={()=>setScr("auth")}/>;
  if(scr==="plans")return <PlansScreen onBack={()=>setScr("main")} onSelect={plan=>{setSelectedPlan(plan);setScr("payment");}} currentPlan={activePlan?.id}/>;
  if(scr==="payment")return <PaymentScreen plan={selectedPlan} onBack={()=>setScr("plans")} onSuccess={plan=>{(async()=>{
  setActivePlan(plan);
  if(user?.uid){
    await saveUserProfile(user.uid,{plan:plan.id,planActivated:new Date().toISOString()});
    await savePayment(user.uid,{plan:plan.name,amount:plan.price,status:"pending_verification",utr:""});
  }
  setScr("main");setTab("profile");
  msg(\`\${plan.name} plan activated! 🎉\`);
})();}}/>;
  if(chatProfile)return <LiveChat profile={chatProfile} onBack={()=>setChatProfile(null)} currentUser={user}/>;
  if(matchScoreProfile&&scr==="main")return <MatchScoreDetail profile={matchScoreProfile} currentUser={{...f,emoji:f.gender==="Female"?"👩":"👨"}} onBack={()=>setMatchScoreProfile(null)}/>;
  if(showEarlyBird&&!earlyBirdClaimed)return <EarlyBirdPopup userCount={TOTAL_USERS} onClaim={()=>{setEarlyBirdClaimed(true);setActivePlan({id:"gold",name:"Gold",price:0,duration:"3 Months",color:"#D4A017"});setShowEarlyBird(false);msg("🎉 FREE Premium activated! Welcome Founding Member!");}} onSkip={()=>setShowEarlyBird(false)}/>;
  if(appScreen==="managePhotos")return <PhotosManager photos={photos} setPhotos={setPhotos} onBack={()=>setAppScreen(null)}/>;
  if(appScreen==="editProfile")return <EditProfile user={user} formData={f} setFormData={setF} onBack={()=>setAppScreen(null)} onSave={(newF)=>{setUser(u=>({...u,...newF,name:newF.name,emoji:newF.gender==="Female"?"👩":"👨"}));}} toast={msg}/>;
  if(appScreen==="deleteAccount")return <DeleteAccount onBack={()=>setAppScreen(null)} onConfirmDelete={()=>{(async()=>{
  if(user?.uid){await deleteUserProfile(user.uid);}
  try{await signOut(auth);}catch(e){}
  setUser(null);setScr("auth");setRegMode(false);setStep(1);
  setPhotos([]);setInts([]);setActivePlan(null);setAppScreen(null);
  setF({name:"",mob:"",dob:"",gender:"",rel:"",caste:"",gotra:"",marital:"",height:"",complex:"",manglik:"",rashi:"",nakshatra:"",bplace:"",btime:"",edu:"",prof:"",employer:"",income:"",fname:"",focc:"",mname:"",mocc:"",sib:"",ftype:"",fstatus:"",state:"",district:"",city:"",pin:"",about:"",pexp:""});
  msg("Account permanently deleted");
})();}} toast={msg}/>;

  if(scr==="auth")return(
    <div style={{fontFamily:"Georgia,serif",background:C.bg,minHeight:"100vh",maxWidth:480,margin:"0 auto"}}>
      <div style={{background:\`linear-gradient(160deg,\${C.pd},\${C.p})\`,padding:"42px 24px 28px",textAlign:"center"}}>
        <div style={{fontSize:52}}>🪷</div>
        <div style={{fontSize:27,fontWeight:800,color:"#FFF",marginTop:8}}>SangamSutra</div>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.65)",letterSpacing:3,marginTop:4,textTransform:"uppercase"}}>Sacred Thread of Union 🪷</div>
      </div>
      <div style={{padding:"22px 16px"}}>
        <div style={{display:"flex",background:C.pl,borderRadius:12,padding:4,marginBottom:20}}>
          {[false,true].map(isR=>(
            <div key={String(isR)} onClick={()=>{setRegMode(isR);setStep(1);}} style={{flex:1,padding:"10px",textAlign:"center",borderRadius:10,background:regMode===isR?C.p:"transparent",color:regMode===isR?"#FFF":C.p,fontWeight:700,fontSize:13,cursor:"pointer"}}>
              {isR?"Register Free":"Sign In"}
            </div>
          ))}
        </div>
        {!regMode?(
          <OTPLogin onLogin={u=>{setUser(u);if(u.isNew){setRegMode(true);}else{setScr("main");}msg(\`Welcome \${u.name}! 🎉\`);if(u.isNew){setTimeout(()=>setShowEarlyBird(true),1200);}}} onAdminLogin={()=>setScr("admin")} toastFn={msg}/>
        ):(
          <>
            <div style={{display:"flex",gap:5,justifyContent:"center",marginBottom:16}}>
              {[1,2,3,4,5].map(n=><div key={n} style={{height:5,borderRadius:3,background:n<step?C.ok:n===step?C.p:C.b,flex:n===step?1.5:1,transition:"all 0.3s"}}/>)}
            </div>
            <div style={s.card}>
              <div style={{fontSize:12,color:C.tm,fontWeight:700,marginBottom:12}}>Step {step}/5 — {["Account","Personal","Horoscope","Career & Family","Location & About"][step-1]}</div>
              {step===1&&<>
                <div style={s.sec}>👤 Basic Details</div>

                <DOBSelector val={f.dob} set={sf("dob")}/>

              {step===3&&<>

              {step===4&&<>

                <Sel l="Highest Education" val={f.edu} set={sf("edu")} opts={EDUCATION} req/>
                <Sel l="Profession" val={f.prof} set={sf("prof")} opts={PROFESSIONS} req/>
                <I l="Employer / Company" val={f.employer} set={sf("employer")} ph="Optional"/>
                <Sel l="Annual Income" val={f.income} set={sf("income")} opts={INCOME}/>
                <div style={s.sec}>👨‍👩‍👧 Family Background</div>
                <I l="Father's Name" val={f.fname} set={sf("fname")} ph="Full name"/>
                <Sel l="Father's Occupation" val={f.focc} set={sf("focc")} opts={PROFESSIONS}/>
                <I l="Mother's Name" val={f.mname} set={sf("mname")} ph="Full name"/>
                <Sel l="Mother's Occupation" val={f.mocc} set={sf("mocc")} opts={["Homemaker",...PROFESSIONS]}/>

                <R l="Family Status" opts={["Middle Class","Upper Middle Class","Rich","Affluent"]} val={f.fstatus} set={sf("fstatus")}/>
              </>}
              {step===5&&<>
                <div style={s.sec}>📍 Location Details</div>

                <I l="City / Town / Village" val={f.city} set={sf("city")} ph="e.g. Nowrozabad" req/>

})();}}} style={{...s.btn,flex:2}}>{step<5?"Next →":"🎉 Complete Profile"}</button>
            </div>
          </>

      <div style={{background:\`linear-gradient(135deg,\${C.pd},\${C.p})\`,padding:"13px 16px",display:"flex",alignItems:"center",gap:10,position:"sticky",top:0,zIndex:10}}>

    <div style={{fontFamily:"Georgia,serif",background:C.bg,minHeight:"100vh",maxWidth:480,margin:"0 auto"}}>

        <div style={{display:"flex",gap:10,alignItems:"center"}}>

          <div style={{width:32,height:32,borderRadius:"50%",background:"rgba(255,255,255,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{user?.emoji||"🙂"}</div>
        </div>
      </div>
      <div style={{paddingBottom:72}}>
        {tab==="home"&&(
          <div style={{padding:12}}>
            <div style={{background:\`linear-gradient(135deg,\${C.p},\${C.pd})\`,borderRadius:16,padding:16,marginBottom:16,color:"#FFF"}}>

              <div style={{fontSize:18,fontWeight:700,marginTop:2}}>{user?.name||f.name||"Dear Member"}</div>
              {!activePlan&&<div onClick={()=>setScr("plans")} style={{marginTop:12,background:"rgba(255,255,255,0.2)",borderRadius:10,padding:"9px 13px",fontSize:12,cursor:"pointer",display:"flex",justifyContent:"space-between"}}><span>🔓 Upgrade to Premium</span><span style={{fontWeight:700}}>→</span></div>}
              {activePlan&&<div style={{marginTop:12,background:"rgba(255,255,255,0.2)",borderRadius:10,padding:"9px 13px",fontSize:12}}>⭐ {activePlan.name} Plan Active</div>}
            </div>
            {!earlyBirdClaimed&&TOTAL_USERS<500&&<EarlyBirdBanner userCount={TOTAL_USERS} onClaim={()=>setShowEarlyBird(true)}/>}
            {earlyBirdClaimed&&<div style={{background:"linear-gradient(135deg,#2D7A4F,#1B5E20)",borderRadius:14,padding:14,marginBottom:14,color:"#FFF",display:"flex",gap:12,alignItems:"center"}}><div style={{fontSize:28}}>🏆</div><div><div style={{fontWeight:800,fontSize:13}}>Founding Member!</div><div style={{fontSize:11,opacity:0.85,marginTop:2}}>Your FREE 3-Month Premium is active</div></div></div>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
              {[["🔍","Browse","Find matches"],["💕","Interests",\`\${ints.length} sent\`],["💬","Chat",activePlan?"Active":"Premium"]].map(([ic,ti,su])=>(
                <div key={ti} onClick={ti==="Chat"?()=>setTab("messages"):undefined} style={{background:C.card,borderRadius:12,padding:12,textAlign:"center",boxShadow:"0 2px 8px rgba(181,69,27,0.08)",border:\`1px solid \${C.b}\`,cursor:ti==="Chat"?"pointer":"default"}}>
                  <div style={{fontSize:20}}>{ic}</div><div style={{fontSize:11,fontWeight:700,color:C.t,marginTop:3}}>{ti}</div><div style={{fontSize:10,color:C.tl,marginTop:1}}>{su}</div>
                </div>
              ))}
            </div>
            <div style={{fontWeight:700,color:C.t,fontSize:14,marginBottom:10}}>✨ Suggested Matches</div>
            {SAMPLE_PROFILES.filter(p=>p.status==="active").map(p=>(
              <div key={p.id} onClick={()=>setSel(p)} style={{background:C.card,borderRadius:18,overflow:"hidden",boxShadow:"0 4px 16px rgba(181,69,27,0.1)",border:\`1px solid \${C.b}\`,marginBottom:12,cursor:"pointer"}}>

                  {p.emoji}

                  <div style={{position:"absolute",bottom:10,right:10,fontSize:11,background:"rgba(0,0,0,0.4)",color:"#FFF",borderRadius:10,padding:"2px 8px"}}>{p.district}, {p.state.split(" ")[0]}</div>

                <div style={{padding:13}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div><div style={{fontSize:15,fontWeight:700,color:C.t}}>{p.name}</div><div style={{fontSize:12,color:C.tm,marginTop:2}}>{p.age} yrs • {p.height} • {p.profession}</div></div>
                    <button onClick={e=>sendInt(p.id,e)} style={{border:\`2px solid \${ints.includes(p.id)?C.ok:C.p}\`,borderRadius:9,padding:"6px 12px",fontSize:12,fontWeight:700,color:ints.includes(p.id)?C.ok:C.p,background:ints.includes(p.id)?"#E8F5EE":C.pl,cursor:"pointer"}}>{ints.includes(p.id)?"✓":"💕"}</button>
                  </div>
                  <div style={{marginTop:8,display:"flex",gap:6,flexWrap:"wrap"}}>
                    <Tag ch={\`\${p.religion} • \${p.caste}\`}/><Tag ch={p.edu}/>
                  </div>
                  <div style={{marginTop:8}}>
                    {(()=>{const mr=calculateMatchScore({...f,emoji:f.gender==="Female"?"👩":"👨"},p);return <MatchBadge score={mr.score} grade={mr.grade} color={mr.gradeColor} size="small"/>;})()}
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
        {tab==="matches"&&(
          <SmartMatchesTab
            currentUser={{...f,emoji:f.gender==="Female"?"👩":"👨"}}
            allProfiles={SAMPLE_PROFILES}
            onSelect={p=>setSel(p)}
            onViewScore={p=>setMatchScoreProfile(p)}
            sentInterests={ints}
            onSendInterest={sendInt}
          />
        )}
        {tab==="search"&&(
          <div style={{padding:12}}>
            <div style={s.card}>
              <div style={s.sec}>🔍 Search Filters</div>
              <Sel l="Religion" val={f.sr||""} set={v=>setF(p=>({...p,sr:v}))} opts={RELIGIONS}/>
              <R l="Looking For" opts={["Male","Female"]} val={f.sg||""} set={v=>setF(p=>({...p,sg:v}))}/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <I l="Min Age" type="number" val={f.mna||""} set={v=>setF(p=>({...p,mna:v}))} ph="18"/>
                <I l="Max Age" type="number" val={f.mxa||""} set={v=>setF(p=>({...p,mxa:v}))} ph="40"/>
              </div>
              <Sel l="State / UT" val={f.ss||""} set={v=>setF(p=>({...p,ss:v,sd:""}))} opts={ALL_STATES}/>
              {f.ss&&<Sel l="District" val={f.sd||""} set={v=>setF(p=>({...p,sd:v}))} opts={DISTRICTS[f.ss]||[]}/>}
              <R l="Manglik" opts={["Manglik","Non-Manglik","Any"]} val={f.sm||"Any"} set={v=>setF(p=>({...p,sm:v}))}/>
              <Sel l="Education" val={f.se||""} set={v=>setF(p=>({...p,se:v}))} opts={EDUCATION}/>

            </div>
            <div style={{fontSize:12,color:C.tl,fontWeight:600,marginBottom:10}}>{SAMPLE_PROFILES.length} profiles found</div>
            {SAMPLE_PROFILES.map(p=>(
              <div key={p.id} onClick={()=>setSel(p)} style={{...s.card,display:"flex",gap:12,alignItems:"center",cursor:"pointer"}}>
                <div style={{fontSize:34,width:46,height:46,borderRadius:"50%",background:C.pl,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{p.emoji}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14,color:C.t}}>{p.name}</div>
                  <div style={{fontSize:11,color:C.tm,marginTop:2}}>{p.age} yrs • {p.district}, {p.state.split(" ")[0]}</div>
                  <div style={{marginTop:6,display:"flex",gap:6,flexWrap:"wrap"}}><Tag ch={p.religion}/><Bdg ch={p.manglik} color={p.manglik==="Manglik"?C.err:C.ok}/></div>
                </div>
              </div>
            ))}
          </div>
        )}
        {tab==="interests"&&(
          <div style={{padding:12}}>
            <div style={{display:"flex",background:C.pl,borderRadius:12,padding:4,marginBottom:14}}>
              {["Sent","Received","Accepted"].map((t,i)=>(
                <div key={t} style={{flex:1,padding:"9px",textAlign:"center",borderRadius:10,background:i===0?C.p:"transparent",color:i===0?"#FFF":C.p,fontWeight:700,fontSize:12,cursor:"pointer"}}>{t}</div>
              ))}
            </div>
            {ints.length===0?<div style={{textAlign:"center",padding:"50px 20px",color:C.tl}}><div style={{fontSize:52}}>💕</div><div style={{marginTop:10,fontWeight:600,color:C.t}}>No interests sent yet</div></div>
            :SAMPLE_PROFILES.filter(p=>ints.includes(p.id)).map(p=>(
              <div key={p.id} style={{...s.card,display:"flex",gap:12,alignItems:"center"}}>
                <div style={{fontSize:32,width:44,height:44,borderRadius:"50%",background:C.pl,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{p.emoji}</div>
                <div style={{flex:1}}><div style={{fontWeight:700,color:C.t}}>{p.name}</div><div style={{fontSize:11,color:C.tm}}>{p.age} yrs • {p.district}</div><div style={{marginTop:5}}><Tag ch="Interest Sent ✓" gold/></div></div>
                {activePlan&&<button onClick={()=>setChatProfile(p)} style={{...s.btn,width:"auto",padding:"8px 14px",fontSize:12}}>💬 Chat</button>}
              </div>
            ))}
          </div>
        )}
        {tab==="messages"&&(
          <div style={{padding:12}}>
            {!activePlan?(
              <div style={{textAlign:"center",padding:"44px 16px 20px"}}>
                <div style={{fontSize:56}}>💬</div>
                <div style={{fontWeight:700,fontSize:16,color:C.t,marginTop:12}}>Live Chat — Premium Feature</div>
                <div style={{fontSize:13,marginTop:8,lineHeight:1.7,color:C.tm}}>Upgrade to chat directly with your matches in real-time.</div>
                <button style={{...s.btn,marginTop:20}} onClick={()=>setScr("plans")}>View Plans →</button>
              </div>
            ):(
              <div>
                <div style={{fontSize:14,fontWeight:700,color:C.t,marginBottom:4}}>💬 Live Messages</div>
                <div style={{fontSize:11,color:C.tl,marginBottom:14}}>Send interest first to start chatting</div>
                {ints.length===0?<div style={{textAlign:"center",padding:"40px 20px",color:C.tl}}><div style={{fontSize:48}}>💬</div><div style={{marginTop:10,fontWeight:600,color:C.t}}>No conversations yet</div><div style={{fontSize:12,marginTop:5}}>Send interest to profiles to start chatting</div></div>
                :SAMPLE_PROFILES.filter(p=>ints.includes(p.id)).map(p=>(
                  <div key={p.id} onClick={()=>setChatProfile(p)} style={{...s.card,display:"flex",gap:12,alignItems:"center",cursor:"pointer",position:"relative"}}>
                    <div style={{width:46,height:46,borderRadius:"50%",background:C.pl,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,flexShrink:0,position:"relative"}}>{p.emoji}<div style={{position:"absolute",bottom:0,right:0,width:12,height:12,borderRadius:"50%",background:C.ok,border:"2px solid #FFF"}}/></div>
                    <div style={{flex:1}}><div style={{fontWeight:700,color:C.t,fontSize:14}}>{p.name}</div><div style={{fontSize:12,color:C.tl,marginTop:2}}>Tap to start chatting... 💬</div></div>
                    <div style={{fontSize:10,color:C.tl}}>Now</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
        {tab==="profile"&&(
          <div style={{padding:12}}>
            <div style={{...s.card,textAlign:"center",paddingTop:24,paddingBottom:20}}>
              {(photos.find(p=>p.isPrimary)?.url||photo)?<img src={photos.find(p=>p.isPrimary)?.url||photo} alt="" style={{width:76,height:76,borderRadius:"50%",objectFit:"cover",margin:"0 auto 10px",display:"block",border:\`3px solid \${C.p}\`}}/>:<div style={{width:76,height:76,borderRadius:"50%",background:\`linear-gradient(135deg,\${C.p},\${C.pd})\`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,color:"#FFF",margin:"0 auto 10px"}}>{user?.emoji||"🙂"}</div>}
              {photos.length>0&&<div style={{display:"flex",gap:4,justifyContent:"center",marginBottom:8}}>{photos.slice(0,5).map(p=><img key={p.id} src={p.url} alt="" style={{width:28,height:28,borderRadius:"50%",objectFit:"cover",border:\`2px solid \${p.isPrimary?C.p:C.b}\`}}/>)}{photos.length>5&&<div style={{width:28,height:28,borderRadius:"50%",background:C.pl,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:C.p}}>+{photos.length-5}</div>}</div>}
              <div style={{fontSize:17,fontWeight:800,color:C.t}}>{user?.name||f.name||"Your Name"}</div>
              <div style={{fontSize:12,color:C.tm,marginTop:2}}>{user?.mob||"Mobile verified ✓"}</div>
              {f.district&&f.state&&<div style={{fontSize:12,color:C.tl,marginTop:2}}>📍 {f.district}, {f.state}</div>}
              <div style={{marginTop:8,display:"flex",gap:6,justifyContent:"center",flexWrap:"wrap"}}>
                {activePlan?<Bdg ch={\`⭐ \${activePlan.name} Member\`} color={activePlan.color}/>:<Tag ch="Free Member"/>}
                {f.rel&&<Tag ch={f.rel}/>}
              </div>
              {!activePlan&&<div onClick={()=>setScr("plans")} style={{marginTop:12,background:\`linear-gradient(135deg,\${C.a},#8B6914)\`,borderRadius:10,padding:"9px 14px",fontSize:13,color:"#FFF",fontWeight:700,cursor:"pointer"}}>⭐ Upgrade — From ₹299</div>}
            </div>
            {[["✏️","Edit Profile","Update details"],["📸","Photos",\`\${photos.length} photos uploaded\`],["🔯","Horoscope","Kundali info"],["⭐","Subscription","Manage plan"],["🔔","Notifications","Alerts"],["🔒","Privacy","Visibility"],["📞","Support","Help & contact"],["🗑","Delete Account","Permanently remove"]].map(([ic,la,su])=>(
              <div key={la} onClick={la==="Subscription"?()=>setScr("plans"):la==="Edit Profile"?()=>setAppScreen("editProfile"):la==="Photos"?()=>setAppScreen("managePhotos"):la==="Delete Account"?()=>setAppScreen("deleteAccount"):undefined} style={{...s.card,display:"flex",alignItems:"center",gap:12,cursor:"pointer",padding:"12px 14px",marginBottom:8,border:la==="Delete Account"?\`1px solid \${C.err}22\`:undefined}}>
                <div style={{fontSize:19,color:la==="Delete Account"?C.err:"inherit"}}>{ic}</div>
                <div style={{flex:1}}><div style={{fontWeight:600,fontSize:13,color:C.t}}>{la}</div><div style={{fontSize:11,color:C.tl,marginTop:1}}>{su}</div></div>
                <div style={{color:C.tl,fontSize:15}}>›</div>
              </div>
            ))}
            <button onClick={()=>{setUser(null);setScr("auth");setRegMode(false);setStep(1);setPhoto(null);setInts([]);setActivePlan(null);setF({name:"",mob:"",dob:"",gender:"",rel:"",caste:"",gotra:"",marital:"",height:"",complex:"",manglik:"",rashi:"",nakshatra:"",bplace:"",btime:"",edu:"",prof:"",employer:"",income:"",fname:"",focc:"",mname:"",mocc:"",sib:"",ftype:"",fstatus:"",state:"",district:"",city:"",pin:"",about:"",pexp:""});msg("Signed out");}} style={{...s.btn,background:"transparent",color:C.err,border:\`2px solid \${C.err}\`,boxShadow:"none",marginTop:4}}>Sign Out</button>
            <div style={{textAlign:"center",fontSize:10,color:C.tl,marginTop:14}}>SangamSutra v3.0 • Made in India 🇮🇳 | sangamsutra.com</div>
          </div>
        )}
      </div>
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"#FFF",borderTop:\`1px solid \${C.b}\`,display:"flex",justifyContent:"space-around",padding:"7px 0 10px",zIndex:50,boxShadow:"0 -2px 12px rgba(181,69,27,0.1)"}}>
        {[["home","🏠","Home"],["matches","✨","Matches"],["search","🔍","Search"],["interests","💕","Interests"],["messages","💬","Chat"],["profile","👤","Profile"]].map(([id,ic,la])=>(
          <div key={id} onClick={()=>setTab(id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer",flex:1}}>
            <div style={{fontSize:tab===id?23:19,transition:"all 0.2s"}}>{ic}</div>
            <div style={{fontSize:9,fontWeight:tab===id?700:400,color:tab===id?C.p:C.tl}}>{la}</div>
            {tab===id&&<div style={{width:4,height:4,borderRadius:"50%",background:C.p}}/>}
          </div>
        ))}
      </div>
      {toast&&<Toast msg={toast.m} type={toast.t}/>}
      <style>{\`*{box-sizing:border-box;}body{margin:0;}::-webkit-scrollbar{display:none;}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}\`}</style>
    </div>
  );
}


// Mount app
const container = document.getElementById("root");
const rootEl = ReactDOM.createRoot(container);
rootEl.render(React.createElement(SangamSutraApp));
`;
</script>
